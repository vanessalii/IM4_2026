<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
    <body class="login-page">
    <div class="login-box">
    <h1>SleepySheepy</h1>
    <p class="untertitel">Willkommen zurück!</p>

    <div class="umschalter">
      <button class="umschalter-button aktiv" type="button">Anmelden</button>
      <a class="umschalter-button" href="register.html">Registrieren</a>
    </div>

    <form id="loginForm">
      <div>
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit">Anmelden</button>
    </form>
   
    
    <script src="js/login.js"></script>
     </div>
  </body>
</html>
