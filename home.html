<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="home-seite">

  <!-- Obere Navigation -->

  <header class="topbar">

    <div class="logo-bereich">
      <div class="logo">🐑</div>

      <div>
        <h1>SleepySheepy</h1>
        <p>Schlaf-Tracker für Kinder</p>
      </div>
    </div>

    <button class="abmelden-button">
      Abmelden
    </button>

  </header>

  <!-- Hauptbereich -->

 <main class="hauptbereich">

  <!-- Begrüssung -->

  <section class="gruss-bereich">
    <h2>🌙 Guten Morgen!</h2>
  </section>

  <!-- Letzte Nacht -->

  <section class="home-karte">

    <h2>Letzte Nacht</h2>

    <div class="nacht-inhalt">

      <div class="einstellung-box">

        <h3>Hörspiel</h3>

        <span>Blaues Licht</span>

      </div>

      <div class="aufwach-liste">

        <div class="aufwach-eintrag">
          <strong>23:15 Uhr</strong>
          <span>Aufgewacht</span>
        </div>

        <div class="aufwach-eintrag">
          <strong>01:20 Uhr</strong>
          <span>Aufgewacht</span>
        </div>

        <div class="aufwach-eintrag">
          <strong>03:00 Uhr</strong>
          <span>Aufgewacht</span>
        </div>

      </div>

    </div>

    <div class="gesamt-box">
      Gesamt: <strong>3x aufgewacht</strong>
    </div>

  </section>

  <!-- Diese Woche -->

  <section class="home-karte">

    <h2>Diese Woche</h2>

    <div class="diagramm-wrapper">

      <div class="y-achse">
        <span>8</span>
        <span>7</span>
        <span>6</span>
        <span>5</span>
        <span>4</span>
        <span>3</span>
        <span>2</span>
        <span>1</span>
        <span>0</span>
      </div>

      <div class="balken-diagramm">

        <div
          class="balken"
          style="height: 12.5%;"
          data-wert="1x aufgewacht"
        >
          <span>Mo</span>
        </div>

        <div
          class="balken"
          style="height: 37.5%;"
          data-wert="3x aufgewacht"
        >
          <span>Di</span>
        </div>

        <div
          class="balken"
          style="height: 25%;"
          data-wert="2x aufgewacht"
        >
          <span>Mi</span>
        </div>

        <div
          class="balken"
          style="height: 12.5%;"
          data-wert="1x aufgewacht"
        >
          <span>Do</span>
        </div>

        <div
          class="balken"
          style="height: 50%;"
          data-wert="4x aufgewacht"
        >
          <span>Fr</span>
        </div>

        <div
          class="balken"
          style="height: 25%;"
          data-wert="2x aufgewacht"
        >
          <span>Sa</span>
        </div>

        <div
          class="balken"
          style="height: 37.5%;"
          data-wert="3x aufgewacht"
        >
          <span>So</span>
        </div>

      </div>

    </div>

  </section>

</main>

  <!-- Untere Navigation -->

  <nav class="bottom-nav">

    <a class="nav-item aktiv" href="home.html">

      <img
        class="nav-icon"
        src="bilder/icon_home.png"
        alt="Home"
      >

      <p>Home</p>

    </a>

    <a class="nav-item" href="statistik.html">

      <img
        class="nav-icon"
        src="bilder/icon_statistik.png"
        alt="Statistik"
      >

      <p>Statistik</p>

    </a>

    <a
      class="nav-item icon-personalisierung"
      href="personalisierung.html"
    >

      <div class="icon-personalisierung-kreis">

        <img
          src="bilder/Icon_Personalisierung.png"
          alt="Personalisierung"
        >

      </div>

    </a>

    <a class="nav-item" href="blog.html">

      <img
        class="nav-icon"
        src="bilder/icon_blog.png"
        alt="Blog"
      >

      <p>Blog</p>

    </a>

    <a class="nav-item" href="einstellungen.html">

      <img
        class="nav-icon"
        src="bilder/icon_profil.png"
        alt="Profil"
      >

      <p>Profil</p>

    </a>

  </nav>

</body>
</html>
