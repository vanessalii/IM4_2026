<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registrieren</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-box">
    <h1>SleepySheepy</h1>
    <p class="untertitel">Erstelle einen neuen Account, um fortzufahren.</p>

    <div class="umschalter">
  <a class="umschalter-button" href="login.html">Anmelden</a>

  <button class="umschalter-button aktiv" type="button">
    Registrieren
  </button>
</div>

    <form id="registerForm">
      <div>
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit"> Registrieren</button>
    </form>

    

    <script src="js/register.js"></script>
    </div>
  </body>
</html>
