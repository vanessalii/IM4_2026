<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamSheep | Blog</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="blog-page">

  <div class="blog-wrapper">

    <!-- HEADER -->
     <header class="topbar">

    <div class="logo-bereich">
      <div class="logo">🐑</div>

      <div>
        <h1>SleepySheepy</h1>
        <p>Schlaf-Tracker für Kinder</p>
      </div>
    </div>

    <button class="abmelden-button" id="logoutBtn" type="button">
  Abmelden
</button>

  </header>

    <!-- MAIN -->
    <main class="blog-main">
      <section class="blog-hero">
        <div>
          <h2>Blog &amp; Community</h2>
          <p>Teile Erfahrungen und lerne von anderen Eltern</p>
        </div>

        <button class="blog-new-post" type="button">
          <span>+</span>
          Neuer Beitrag
        </button>
      </section>

      <section class="blog-create-form" id="blogCreateForm">
        <h2>Neuen Beitrag erstellen</h2>

        <form>
          <label for="postTitle">Titel</label>
          <input
            type="text"
            id="postTitle"
            name="postTitle"
            placeholder="Gib deinem Beitrag einen Titel..."
          />

          <label for="postCategory">Kategorie</label>

          <div class="blog-custom-select" id="blogCategorySelect">
            <button type="button" class="blog-custom-select-button">
              <span id="blogSelectedCategory">Tipps &amp; Tricks</span>
              <span class="blog-custom-select-arrow">⌄</span>
            </button>

            <div class="blog-custom-select-options">
              <button type="button" data-value="Tipps & Tricks">Tipps &amp; Tricks</button>
              <button type="button" data-value="Schlafhygiene">Schlafhygiene</button>
              <button type="button" data-value="Routine">Routine</button>
              <button type="button" data-value="Probleme">Probleme</button>
            </div>
          </div>

          <input type="hidden" id="postCategory" name="postCategory" value="Tipps & Tricks" />

          <label for="postContent">Inhalt</label>
          <textarea
            id="postContent"
            name="postContent"
            placeholder="Teile deine Gedanken und Erfahrungen..."
          ></textarea>

          <div class="blog-form-actions">
            <button type="submit" class="blog-publish-button">
              Veröffentlichen
            </button>

            <button type="button" class="blog-cancel-button" id="blogCancelButton">
              Abbrechen
            </button>
          </div>
        </form>
      </section>

      <nav class="blog-filter-bar" aria-label="Blog Kategorien">
        <button class="blog-filter is-active" type="button" data-category="Alle">Alle</button>
        <button class="blog-filter" type="button" data-category="Tipps & Tricks">Tipps &amp; Tricks</button>
        <button class="blog-filter" type="button" data-category="Schlafhygiene">Schlafhygiene</button>
        <button class="blog-filter" type="button" data-category="Routine">Routine</button>
        <button class="blog-filter" type="button" data-category="Probleme">Probleme</button>
      </nav>

      <section class="blog-posts">
        
      </section>
    </main>

    <nav class="bottom-nav">

    <a class="nav-item" href="home.html">
      <img 
        class="nav-icon"
        src="Bilder/Icon_Home.png" 
        alt="Home"
      >
      <p>Home</p>
    </a>

    <a class="nav-item" href="statistik.html">
      <img 
        class="nav-icon"
        src="Bilder/Icon_Statistik.png" 
        alt="Statistik"
      >
      <p>Statistik</p>
    </a>

    <a class="nav-item icon-personalisierung" href="personalisierung.html">
      <div class="icon-personalisierung-kreis">
        <img 
          src="Bilder/Icon_Personalisierung.png" 
          alt="Personalisierung"
        >
      </div>
    </a>

    <a class="nav-item" href="blog.html">
      <img 
        class="nav-icon"
        src="Bilder/Icon_Blog.png" 
        alt="Blog"
      >
      <p>Blog</p>
    </a>

    <a class="nav-item aktiv" href="einstellungen.html">
      <img 
        class="nav-icon"
        src="Bilder/Icon_Profil.png" 
        alt="Profil"
      >
      <p>Profil</p>
    </a>

  </nav>
  </div>

  <script src="js/blog.js"></script>
</body>
</html>
